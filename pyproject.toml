[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-shortener"
version = "0.1.0"
description = "Governed agentic URL shortener engineering prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
shortener = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
